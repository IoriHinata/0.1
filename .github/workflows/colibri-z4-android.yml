name: ColibriOS DIGMA Z4 Port Lab
on:
  push:
    paths:
      - 'colibri-installer/**'
      - '.github/workflows/colibri-z4-android.yml'
  workflow_dispatch:
jobs:
  mips-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MIPS cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu make
      - name: Build ATJ2127 MIPS kernel
        working-directory: colibri-installer/port/mips
        run: make CROSS=mipsel-linux-gnu-
      - uses: actions/upload-artifact@v4
        with:
          name: ColibriOS-DIGMA-Z4-MIPS-RAM-test
          path: |
            colibri-installer/port/mips/colibri-z4.elf
            colibri-installer/port/mips/colibri-z4.bin
            colibri-installer/port/mips/colibri-z4.map
            colibri-installer/port/mips/colibri-z4.dis
          if-no-files-found: error
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: colibri-installer
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ColibriOS-DIGMA-Z4-Port-Lab
          path: colibri-installer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
