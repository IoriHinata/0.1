name: ColibriOS DIGMA Z4 Port Lab
on:
  push:
    paths:
      - 'colibri-installer/**'
      - '.github/workflows/colibri-z4-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: colibri-installer
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ColibriOS-DIGMA-Z4-Port-Lab
          path: colibri-installer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
